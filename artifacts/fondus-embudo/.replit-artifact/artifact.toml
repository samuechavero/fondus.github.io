kind = "web"
previewPath = "/"
title = "Fondus — Embudo Gamificado"
description = "SPA móvil-first de conversión para Fondus, con simulación financiera guiada, asesor conversacional, experiencia gamificada y formulario de adhesión."
version = "1.0.0"
id = "artifacts/fondus-embudo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21620

[services.development]
run = "pnpm --filter @workspace/fondus-embudo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fondus-embudo", "run", "build" ]
serve = "static"
publicDir = "artifacts/fondus-embudo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21620"
BASE_PATH = "/"
